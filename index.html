<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binh Le - Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
    }

    header {
      background-color: #1a1a2e;
      color: #fff;
      padding: 60px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      color: #a0a0b8;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    section {
      margin-bottom: 40px;
    }

    section h2 {
      font-size: 1.6rem;
      margin-bottom: 20px;
      color: #1a1a2e;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 8px;
    }

    .experience-card {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .experience-card h3 {
      font-size: 1.3rem;
      color: #1a1a2e;
    }

    .experience-card .role {
      font-size: 1.05rem;
      color: #555;
      margin-top: 4px;
    }

    .experience-card .team {
      font-size: 0.95rem;
      color: #777;
      margin-top: 4px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #999;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Binh Le</h1>
    <p>Software Engineer</p>
  </header>

  <div class="container">
    <section id="experience">
      <h2>Experience</h2>
      <div class="experience-card">
        <h3>Uber</h3>
        <p class="role">Software Engineer 1</p>
        <p class="team">Experimentation</p>
      </div>
    </section>
  </div>

  <footer>
    &copy; 2026 Binh Le
  </footer>
</body>
</html>
